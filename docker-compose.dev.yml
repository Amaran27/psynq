services:
  postgres:
    image: postgres:15-alpine
    container_name: psynq-postgres-dev
    environment:
      - POSTGRES_USER=psynq_user
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=psynq
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mount database initialization scripts
      - ./deploy/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psynq_user -d psynq || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: psynq-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: psynq-minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: psynq-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/psynq-recordings;
      echo 'Bucket psynq-recordings created';
      exit 0;
      "

  asterisk:
    build:
      context: ./deploy/asterisk
      dockerfile: Dockerfile
    container_name: psynq-asterisk
    network_mode: host
    environment:
      - ASTERISK_UID=1000
      - ASTERISK_GID=1000
      - TZ=UTC
      - DB_HOST=127.0.0.1
      - DB_PORT=5432
      - DB_USER=psynq_user
      - DB_PASSWORD=mysecretpassword
      - DB_DATABASE=psynq
      - ARI_USER=psynq-app
      - ARI_PASSWORD=psynq-pass
      # MinIO configuration for recording uploads
      - MINIO_ENDPOINT=http://127.0.0.1:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=psynq-recordings
    volumes:
      # Mount custom Asterisk configurations (Twilio SIP trunk, dialplan, etc.)
      - ./deploy/asterisk/asterisk-config:/etc/asterisk:rw
      # Mount ODBC configuration files
      - ./deploy/asterisk/odbc-config/odbc.ini:/etc/odbc.ini:ro
      - ./deploy/asterisk/odbc-config/odbcinst.ini:/etc/odbcinst.ini:ro
      # Mount recording upload script
      - ./deploy/asterisk/scripts:/usr/local/bin:ro
      - asterisk_var:/var/lib/asterisk
      - asterisk_spool:/var/spool/asterisk
      - asterisk_log:/var/log/asterisk
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show version' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      target: dev
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: psynq-backend-dev
    network_mode: host
    working_dir: /usr/src/app/packages/backend
    volumes:
      - ./packages/backend/src:/usr/src/app/packages/backend/src:cached
      - ./packages/backend/tsconfig.json:/usr/src/app/packages/backend/tsconfig.json:cached
      - ./packages/backend/nest-cli.json:/usr/src/app/packages/backend/nest-cli.json:cached
      - ./packages/core/dist:/usr/src/app/packages/core/dist:cached
      - backend_node_modules:/usr/src/app/packages/backend/node_modules
      - core_node_modules:/usr/src/app/packages/core/node_modules
    environment:
      - NODE_ENV=development
      # Internal Docker networking - using host IP since backend uses host network
      - ASTERISK_WEBRTC_URI=ws://127.0.0.1:8088/ws
      - ASTERISK_ARI_URL=http://127.0.0.1:8088
      - ASTERISK_ARI_USERNAME=psynq-app
      - ASTERISK_ARI_PASSWORD=psynq-pass
      - ASTERISK_APP=psynq-app
      - ASTERISK_WEBRTC_DOMAIN=127.0.0.1
      - ASTERISK_TRANSPORT=transport-ws
      - ASTERISK_CONTEXT=from-webrtc
      - DB_HOST=127.0.0.1
      - DB_PORT=5432
      - DB_USERNAME=psynq_user
      - DB_PASSWORD=mysecretpassword
      - DB_DATABASE=psynq
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=127.0.0.1
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=psynq-recordings
      # JWT Configuration (from .env)
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      # Storage Configuration (allows switching between providers)
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-minio}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      asterisk:
        condition: service_healthy
    dns:
      - 8.8.8.8
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile.frontend.dev
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: psynq-web-dev
    network_mode: host
    working_dir: /usr/src/app/packages/web
    volumes:
      - ./packages/web:/usr/src/app/packages/web:cached
      - ./packages/core/src:/usr/src/app/packages/core/src:cached
      - web_node_modules:/usr/src/app/packages/web/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      # Browser must access API from outside (localhost), but internal SSR might need internal names
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      # WebRTC is client-side, so it accesses Asterisk via localhost mapped port
      - NEXT_PUBLIC_ASTERISK_WS=ws://localhost:8088/ws
    command: ["/bin/sh", "-c", "rm -rf packages/web/next.config.js && npm run build --workspace=@psynq/core && npm run dev -- --webpack"]
    dns:
      - 8.8.8.8
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

networks:
  default:
    name: psynq-dev
    driver: bridge

volumes:
  backend_node_modules:
  core_node_modules:
  web_node_modules:
  web_next:
  pgdata:
  minio_data:
  asterisk_var:
  asterisk_spool:
  asterisk_log: