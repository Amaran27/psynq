## Authentication Methods

### 1. JWT Bearer Token (Preferred)
```http
Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
```

**Token Lifecycle**:
- Access token: 15 minutes (900 seconds)
- Refresh token: 30 days
- Login: `/auth/login` → Returns both tokens
- Refresh: `/auth/refresh` → Returns new access token
- Logout: `/auth/logout` → Invalidates refresh token

### 2. API Key (Service Accounts)
```http
X-API-Key: sk_live_550e8400e29b41d4a716446655440000
```

**Key Format**: `sk_live_{32-char hex}` or `sk_test_{32-char hex}`

