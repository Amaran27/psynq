# Canonical OpenAPI 3.0 Specification - Psynq CPaaS Platform

**Version**: 1.0.0
**Last Updated**: December 31, 2025
**Status**: SINGLE SOURCE OF TRUTH
**Format**: OpenAPI 3.0.3 (YAML)
**Purpose**: Complete, unambiguous API specification for all 150+ endpoints

---

## OpenAPI 3.0.3 Specification (Full YAML)

```yaml
openapi: 3.0.3
info:
  title: Psynq CPaaS API
  version: 1.0.0
  description: |
    Psynq Cloud Telephony Platform REST API
    
    **Authentication**: All endpoints require Bearer JWT token or API Key
    
    **Rate Limits**: 100 requests/minute per organization
    
    **Base URL**: `https://api.psynq.example.com/v1`
  contact:
    name: Psynq API Support
    email: api-support@psynq.example.com
  license:
    name: Commercial
    url: https://psynq.example.com/license

servers:
  - url: https://api.psynq.example.com/v1
    description: Production
  - url: https://api-staging.psynq.example.com/v1
    description: Staging
  - url: http://localhost:3000/v1
    description: Local development

security:
  - bearerAuth: []
  - apiKeyAuth: []

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Organizations
    description: Organization management
  - name: Users
    description: User management and permissions
  - name: Calls
    description: Call control and management
  - name: Recordings
    description: Call recording and transcription
  - name: Queues
    description: Queue management and statistics
  - name: Phone Numbers
    description: Phone number inventory and routing
  - name: SMS
    description: SMS messaging
  - name: CDR
    description: Call detail records
  - name: Billing
    description: Wallet and billing operations
  - name: CRM
    description: CRM integration
  - name: Campaigns
    description: Campaign management
  - name: Analytics
    description: Reporting and analytics
  - name: Webhooks
    description: Webhook configuration

paths:
  # ============================================================
  # Authentication Endpoints
  # ============================================================
  
  /auth/login:
    post:
      tags: [Authentication]
      summary: Login with email/password
      description: Authenticate and receive JWT tokens
      operationId: login
      security: [] # No auth required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: agent@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: SecurePass123!
                remember_me:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refresh_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    example: 900
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: Obtain new access token using refresh token
      operationId: refreshToken
      security: [] # No auth required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer
                    example: 900
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout and invalidate session
      operationId: logout
      responses:
        '204':
          description: Logout successful
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
  # Organization Endpoints
  # ============================================================
  
  /organizations:
    get:
      tags: [Organizations]
      summary: List organizations
      description: |
        List all organizations. 
        **Requires**: `organizations:read` permission
      operationId: listOrganizations
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/SortParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, suspended, deleted]
        - name: plan_tier
          in: query
          schema:
            type: string
            enum: [free, pro, enterprise]
      responses:
        '200':
          description: Organizations retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Organizations]
      summary: Create organization
      description: |
        Create a new organization.
        **Requires**: `organizations:create` permission
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name, plan_tier]
              properties:
                slug:
                  type: string
                  pattern: '^[a-z0-9-]+$'
                  example: acme-corp
                  minLength: 3
                  maxLength: 50
                name:
                  type: string
                  maxLength: 255
                  example: Acme Corporation
                legal_name:
                  type: string
                  maxLength: 255
                plan_tier:
                  type: string
                  enum: [free, pro, enterprise]
                max_agents:
                  type: integer
                  minimum: 1
                  default: 5
                max_concurrent_calls:
                  type: integer
                  minimum: 1
                  default: 10
                default_caller_id:
                  type: string
                  pattern: '^\+?[1-9]\d{1,14}$'
                  example: "+15551234567"
                time_zone:
                  type: string
                  example: America/New_York
                language:
                  type: string
                  example: en-US
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /organizations/{organizationId}:
    get:
      tags: [Organizations]
      summary: Get organization details
      operationId: getOrganization
      parameters:
        - $ref: '#/components/parameters/OrganizationIdParam'
      responses:
        '200':
          description: Organization retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Organizations]
      summary: Update organization
      description: |
        Partial update of organization fields.
        **Requires**: `organizations:update` permission
      operationId: updateOrganization
      parameters:
        - $ref: '#/components/parameters/OrganizationIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                legal_name:
                  type: string
                  maxLength: 255
                plan_tier:
                  type: string
                  enum: [free, pro, enterprise]
                max_agents:
                  type: integer
                  minimum: 1
                max_concurrent_calls:
                  type: integer
                  minimum: 1
                default_caller_id:
                  type: string
                  pattern: '^\+?[1-9]\d{1,14}$'
                status:
                  type: string
                  enum: [active, suspended]
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Organizations]
      summary: Delete organization
      description: |
        Soft delete organization.
        **Requires**: `organizations:delete` permission
      operationId: deleteOrganization
      parameters:
        - $ref: '#/components/parameters/OrganizationIdParam'
      responses:
        '204':
          description: Organization deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{organizationId}/settings:
    get:
      tags: [Organizations]
      summary: Get organization settings
      operationId: getOrganizationSettings
      parameters:
        - $ref: '#/components/parameters/OrganizationIdParam'
      responses:
        '200':
          description: Settings retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSettings'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Organizations]
      summary: Update organization settings
      operationId: updateOrganizationSettings
      parameters:
        - $ref: '#/components/parameters/OrganizationIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationSettings'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSettings'
        '400':
          $ref: '#/components/responses/BadRequest'

  /organizations/{organizationId}/wallet:
    get:
      tags: [Organizations, Billing]
      summary: Get organization wallet
      operationId: getOrganizationWallet
      parameters:
        - $ref: '#/components/parameters/OrganizationIdParam'
      responses:
        '200':
          description: Wallet retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationWallet'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # User Endpoints
  # ============================================================
  
  /organizations/{organizationId}/users:
    get:
      tags: [Users]
      summary: List users in organization
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/OrganizationIdParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/SortParam'
        - name: role
          in: query
          schema:
            type: string
            enum: [superadmin, admin, supervisor, agent]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, suspended, locked, deleted]
      responses:
        '200':
          description: Users retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer

    post:
      tags: [Users]
      summary: Create user
      description: |
        Create new user in organization.
        **Requires**: `users:create` permission
      operationId: createUser
      parameters:
        - $ref: '#/components/parameters/OrganizationIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password, role]
              properties:
                username:
                  type: string
                  pattern: '^[a-zA-Z0-9_.-]{3,50}$'
                  example: john.doe
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: SecurePass123!
                role:
                  type: string
                  enum: [superadmin, admin, supervisor, agent]
                full_name:
                  type: string
                  maxLength: 255
                department:
                  type: string
                  maxLength: 100
                phone_number:
                  type: string
                  pattern: '^\+?[1-9]\d{1,14}$'
                agent_skill_level:
                  type: integer
                  minimum: 1
                  maximum: 5
                  default: 3
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get user details
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Users]
      summary: Update user
      description: Partial update of user fields
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  maxLength: 255
                department:
                  type: string
                  maxLength: 100
                phone_number:
                  type: string
                  pattern: '^\+?[1-9]\d{1,14}$'
                agent_skill_level:
                  type: integer
                  minimum: 1
                  maximum: 5
                status:
                  type: string
                  enum: [active, suspended, locked]
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    delete:
      tags: [Users]
      summary: Delete user
      description: Soft delete user
      operationId: deleteUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '204':
          description: User deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/permissions:
    get:
      tags: [Users]
      summary: Get user permissions
      operationId: getUserPermissions
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: Permissions retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPermission'

    post:
      tags: [Users]
      summary: Grant permission to user
      operationId: grantPermission
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission]
              properties:
                permission:
                  type: string
                  pattern: '^[a-z_]+:[a-z_]+$'
                  example: calls:create
                resource_type:
                  type: string
                  example: queue
                resource_id:
                  type: string
                  format: uuid
                expires_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Permission granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPermission'

  /users/{userId}/permissions/{permissionId}:
    delete:
      tags: [Users]
      summary: Revoke permission
      operationId: revokePermission
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
        - name: permissionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Permission revoked

  /users/{userId}/preferences:
    get:
      tags: [Users]
      summary: Get user preferences
      operationId: getUserPreferences
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: Preferences retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'

    put:
      tags: [Users]
      summary: Update user preferences
      operationId: updateUserPreferences
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferences'
      responses:
        '200':
          description: Preferences updated

  # ============================================================
  # Call Control Endpoints
  # ============================================================
  
  /calls:
    get:
      tags: [Calls]
      summary: List calls
      description: List calls with filters
      operationId: listCalls
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - name: organization_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [dialing, ringing, answered, on_hold, ended, failed]
        - name: direction
          in: query
          schema:
            type: string
            enum: [inbound, outbound]
        - name: agent_id
          in: query
          schema:
            type: string
            format: uuid
        - name: queue_id
          in: query
          schema:
            type: string
            format: uuid
        - name: started_after
          in: query
          schema:
            type: string
            format: date-time
        - name: started_before
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Calls retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Call'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer

    post:
      tags: [Calls]
      summary: Initiate outbound call
      description: |
        Create and dial outbound call.
        **Requires**: `calls:create` permission
      operationId: createCall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id, caller_number, callee_number]
              properties:
                organization_id:
                  type: string
                  format: uuid
                caller_number:
                  type: string
                  pattern: '^\+?[1-9]\d{1,14}$'
                  example: "+15551234567"
                callee_number:
                  type: string
                  pattern: '^\+?[1-9]\d{1,14}$'
                  example: "+15559876543"
                caller_id:
                  type: string
                  pattern: '^\+?[1-9]\d{1,14}$'
                agent_id:
                  type: string
                  format: uuid
                  description: Agent to handle call (optional)
                queue_id:
                  type: string
                  format: uuid
                  description: Queue for inbound call (optional)
                recording_enabled:
                  type: boolean
                  default: false
                transcription_enabled:
                  type: boolean
                  default: false
                variables:
                  type: object
                  description: Custom call variables
                  additionalProperties: true
      responses:
        '201':
          description: Call initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          description: Insufficient balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /calls/{callId}:
    get:
      tags: [Calls]
      summary: Get call details
      operationId: getCall
      parameters:
        - $ref: '#/components/parameters/CallIdParam'
      responses:
        '200':
          description: Call retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        '404':
          $ref: '#/components/responses/NotFound'

  /calls/{callId}/answer:
    post:
      tags: [Calls]
      summary: Answer ringing call
      description: |
        Answer an inbound call assigned to agent.
        **Requires**: `calls:answer` permission
      operationId: answerCall
      parameters:
        - $ref: '#/components/parameters/CallIdParam'
      responses:
        '200':
          description: Call answered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /calls/{callId}/hangup:
    post:
      tags: [Calls]
      summary: Hangup active call
      description: |
        Terminate active call.
        **Requires**: `calls:hangup` permission
      operationId: hangupCall
      parameters:
        - $ref: '#/components/parameters/CallIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum: [user_busy, call_rejected, destination_out_of_order, normal_unspecified]
                  default: normal_unspecified
      responses:
        '200':
          description: Call hung up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'

  /calls/{callId}/hold:
    post:
      tags: [Calls]
      summary: Place call on hold
      operationId: holdCall
      parameters:
        - $ref: '#/components/parameters/CallIdParam'
      responses:
        '200':
          description: Call on hold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'

  /calls/{callId}/unhold:
    post:
      tags: [Calls]
      summary: Remove call from hold
      operationId: unholdCall
      parameters:
        - $ref: '#/components/parameters/CallIdParam'
      responses:
        '200':
          description: Call unheld
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'

  /calls/{callId}/transfer:
    post:
      tags: [Calls]
      summary: Transfer call
      description: |
        Transfer call to another agent or number.
        **Requires**: `calls:transfer` permission
      operationId: transferCall
      parameters:
        - $ref: '#/components/parameters/CallIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target_type:
                  type: string
                  enum: [agent, queue, phone_number]
                  default: agent
                target:
                  oneOf:
                    - type: string
                      format: uuid
                      description: Agent or Queue ID
                    - type: string
                      pattern: '^\+?[1-9]\d{1,14}$'
                      description: Phone number
      responses:
        '200':
          description: Call transferred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'

  /calls/{callId}/dtmf:
    post:
      tags: [Calls]
      summary: Send DTMF digits
      operationId: sendDtmf
      parameters:
        - $ref: '#/components/parameters/CallIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [digits]
              properties:
                digits:
                  type: string
                  pattern: '^[0-9*#]+$'
                  example: "1234#"
      responses:
        '200':
          description: DTMF sent

  /calls/{callId}/participants:
    get:
      tags: [Calls]
      summary: List call participants
      operationId: listCallParticipants
      parameters:
        - $ref: '#/components/parameters/CallIdParam'
      responses:
        '200':
          description: Participants retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CallParticipant'

  # ============================================================
  # Recording Endpoints
  # ============================================================
  
  /recordings:
    get:
      tags: [Recordings]
      summary: List recordings
      operationId: listRecordings
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - name: call_id
          in: query
          schema:
            type: string
            format: uuid
        - name: organization_id
          in: query
          schema:
            type: string
            format: uuid
        - name: created_after
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Recordings retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CallRecording'
                  total:
                    type: integer

  /recordings/{recordingId}:
    get:
      tags: [Recordings]
      summary: Get recording metadata
      operationId: getRecording
      parameters:
        - name: recordingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recording retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallRecording'

    delete:
      tags: [Recordings]
      summary: Delete recording
      description: |
        Delete recording and file from storage.
        **Requires**: `recordings:delete` permission
      operationId: deleteRecording
      parameters:
        - name: recordingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Recording deleted

  /recordings/{recordingId}/download:
    get:
      tags: [Recordings]
      summary: Download recording file
      description: Returns audio file stream
