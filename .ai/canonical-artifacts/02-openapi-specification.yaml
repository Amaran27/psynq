## Error Codes

| Code | HTTP Status | Description |
|------|-------------|-------------|
| VALIDATION_ERROR | 400 | Request validation failed |
| UNAUTHORIZED | 401 | Invalid/missing credentials |
| FORBIDDEN | 403 | Insufficient permissions |
| NOT_FOUND | 404 | Resource not found |
| CONFLICT | 409 | Resource already exists |
| RATE_LIMIT_EXCEEDED | 429 | Too many requests |
| INTERNAL_ERROR | 500 | Server error |
| SERVICE_UNAVAILABLE | 503 | Service temporarily unavailable |

---

## Rate Limits

- **Default**: 100 requests/minute per organization
- **Burst**: 10 requests/second
- **Headers**:
  - `X-RateLimit-Limit`: 100
  - `X-RateLimit-Remaining`: 95
  - `X-RateLimit-Reset`: 1735699200

---

## Pagination

**Request Parameters**:
- `limit`: Number of items (1-100, default 20)
- `offset`: Number to skip (default 0)
- `sort`: Field and order (e.g., `created_at:desc`)

**Response Structure**:
```json
{
  "data": [...],
  "total": 150,
  "limit": 20,
  "offset": 0
}
```

---

## Validation Rules

### Phone Numbers
- Format: E.164 (`+15551234567`)
- Regex: `^\+?[1-9]\d{1,14}$`
- Max length: 15 digits (excluding +)

### UUIDs
- Format: UUID v4
- Regex: `^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$`

### Email
- Format: RFC 5322
- Regex: `^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}$`

### Password
- Min length: 8 characters
- Must contain: uppercase, lowercase, number, special char

