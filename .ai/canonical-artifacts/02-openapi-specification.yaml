          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                language_code:
                  type: string
                  example: en-US
                  default: en-US
                provider:
                  type: string
                  enum: [deepgram, aws, google]
                  default: deepgram
      responses:
        '202':
          description: Transcription queued

  # ============================================================
  # Queue Endpoints
  # ============================================================
  
  /queues:
    get:
      tags: [Queues]
      summary: List queues
      operationId: listQueues
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - name: organization_id
          in: query
          schema:
            type: string
            format: uuid
            required: true
      responses:
        '200':
          description: Queues retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Queue'
                  total:
                    type: integer

    post:
      tags: [Queues]
      summary: Create queue
      operationId: createQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id, name, extension, strategy]
              properties:
                organization_id:
                  type: string
                  format: uuid
                name:
                  type: string
                  maxLength: 100
                extension:
                  type: string
                  maxLength: 20
                strategy:
                  type: string
                  enum: [ring_all, longest_idle_agent, round_robin, least_recent, fewest_calls, random, linear]
                max_wait_time_seconds:
                  type: integer
                  minimum: 0
                  default: 0
                wrap_up_time_seconds:
                  type: integer
                  minimum: 0
                  default: 30
                ring_timeout_seconds:
                  type: integer
                  minimum: 1
                  default: 15
                weight:
                  type: integer
                  minimum: 1
                  default: 1
      responses:
        '201':
          description: Queue created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'

  /queues/{queueId}:
    get:
      tags: [Queues]
      summary: Get queue details
      operationId: getQueue
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Queue retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'

    patch:
      tags: [Queues]
      summary: Update queue
      operationId: updateQueue
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                strategy:
                  type: string
                  enum: [ring_all, longest_idle_agent, round_robin, least_recent, fewest_calls, random, linear]
                max_wait_time_seconds:
                  type: integer
                  minimum: 0
                active:
                  type: boolean
      responses:
        '200':
          description: Queue updated

    delete:
      tags: [Queues]
      summary: Delete queue
      operationId: deleteQueue
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Queue deleted

  /queues/{queueId}/members:
    get:
      tags: [Queues]
      summary: List queue members
      operationId: listQueueMembers
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Members retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueueMember'

    post:
      tags: [Queues]
      summary: Add queue member
      operationId: addQueueMember
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  format: uuid
                penalty:
                  type: integer
                  minimum: 0
                  maximum: 100
                  default: 0
                membership_type:
                  type: string
                  enum: [static, dynamic]
                  default: static
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueMember'

  /queues/{queueId}/members/{userId}:
    delete:
      tags: [Queues]
      summary: Remove queue member
      operationId: removeQueueMember
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Member removed

  /queues/{queueId}/stats:
    get:
      tags: [Queues]
      summary: Get queue statistics
      description: Get aggregated queue statistics
      operationId: getQueueStats
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Statistics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_calls:
                    type: integer
                  answered_calls:
                    type: integer
                  abandoned_calls:
                    type: integer
                  average_wait_seconds:
                    type: number
                    format: float
                  average_talk_seconds:
                    type: number
                    format: float
                  service_level_percent:
                    type: number
                    format: float

  # ============================================================
  # Phone Number Endpoints
  # ============================================================
  
  /phone-numbers:
    get:
      tags: [Phone Numbers]
      summary: List phone numbers
      operationId: listPhoneNumbers
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - name: organization_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [available, assigned, reserved, porting, disconnected]
        - name: type
          in: query
          schema:
            type: string
            enum: [local, tollfree, national]
        - name: country
          in: query
          schema:
            type: string
              length: 2
              example: US
      responses:
        '200':
          description: Phone numbers retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PhoneNumber'
                  total:
                    type: integer

    post:
      tags: [Phone Numbers]
      summary: Purchase phone number
      description: |
        Purchase available phone number for organization.
        **Requires**: `phone_numbers:purchase` permission
      operationId: purchasePhoneNumber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id, phone_number]
              properties:
                organization_id:
                  type: string
                  format: uuid
                phone_number:
                  type: string
                  pattern: '^\+?[1-9]\d{1,14}$'
                  example: "+15551234567"
      responses:
        '201':
          description: Phone number purchased
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumber'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          description: Insufficient balance

  /phone-numbers/{phoneNumberId}:
    get:
      tags: [Phone Numbers]
      summary: Get phone number details
      operationId: getPhoneNumber
      parameters:
        - name: phoneNumberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Phone number retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumber'

    patch:
      tags: [Phone Numbers]
      summary: Update phone number routing
      operationId: updatePhoneNumber
      parameters:
        - name: phoneNumberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                queue_id:
                  type: string
                  format: uuid
                ivr_flow_id:
                  type: string
                  format: uuid
                sip_trunk_id:
                  type: string
                  format: uuid
                webhook_url:
                  type: string
                  format: uri
      responses:
        '200':
          description: Phone number updated

    delete:
      tags: [Phone Numbers]
      summary: Release phone number
      description: Release phone number back to pool
      operationId: releasePhoneNumber
      parameters:
        - name: phoneNumberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Phone number released

  # ============================================================
  # SMS Endpoints
  # ============================================================
  
  /sms:
    get:
      tags: [SMS]
      summary: List SMS messages
      operationId: listSmsMessages
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - name: organization_id
          in: query
          schema:
            type: string
            format: uuid
            required: true
        - name: direction
          in: query
          schema:
            type: string
            enum: [inbound, outbound]
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, sent, delivered, failed]
      responses:
        '200':
          description: SMS messages retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SmsMessage'
                  total:
                    type: integer

    post:
      tags: [SMS]
      summary: Send SMS message
      description: |
        Send outbound SMS message.
        **Requires**: `sms:create` permission
      operationId: sendSms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id, from_number, to_number, message]
              properties:
                organization_id:
                  type: string
                  format: uuid
                from_number:
                  type: string
                  pattern: '^\+?[1-9]\d{1,14}$'
                  example: "+15551234567"
                to_number:
                  type: string
                  pattern: '^\+?[1-9]\d{1,14}$'
                  example: "+15559876543"
                message:
                  type: string
                  maxLength: 1600
                  example: "Your verification code is 123456"
      responses:
        '201':
          description: SMS queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsMessage'

  /sms/{smsId}:
    get:
      tags: [SMS]
      summary: Get SMS message details
      operationId: getSmsMessage
      parameters:
        - name: smsId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: SMS message retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsMessage'

