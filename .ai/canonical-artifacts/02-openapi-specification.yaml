          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Audio file
          content:
            audio/mpeg: {}
            audio/wav: {}
            audio/ogg: {}
        '404':
          $ref: '#/components/responses/NotFound'

  /recordings/{recordingId}/transcription:
    get:
      tags: [Recordings]
      summary: Get transcription
      operationId: getTranscription
      parameters:
        - name: recordingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transcription retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallTranscription'

    post:
      tags: [Recordings]
      summary: Request transcription
      description: |
        Start transcription process for recording.
        **Requires**: `recordings:transcribe` permission
      operationId: requestTranscription
      parameters:
        - name: recordingId
          in: path
