  #     - mediasoup-worker
  #     - coturn
  #     - asterisk

  minio:
    image: quay.io/minio/minio:latest
    container_name: psynq-minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./minio/data:/data
    command: server /data
    ports:
      - "9000:9000"

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: psynq-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/psynq-recordings;
      echo 'Bucket psynq-recordings created';
      exit 0;
      "

  prometheus:
    image: prom/prometheus:latest
    container_name: psynq-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: psynq-grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3003:3000"

# Notes:
# - This compose file is designed for a local production-like environment. Some services (mediasoup-worker) require native builds and proper configuration.
# - For production deployment consider replacing Docker Compose with a container orchestration platform and enabling TLS/DTLS for TURN and signaling.
