services:
  postgres:
    image: postgres:15
    container_name: psynq-postgres
    environment:
      - POSTGRES_USER=psynq_user
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=psynq_db
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: psynq-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  asterisk:
    image: andrius/asterisk:latest
    container_name: psynq-asterisk
    restart: unless-stopped
    ports:
      - "5060:5060/udp"  # SIP
      - "8088:8088"      # ARI HTTP
      - "8089:8089"      # WebRTC WebSocket
    volumes:
      - ./asterisk/etc/asterisk:/etc/asterisk
    environment:
      - ASTERISK_UID=1000
      - ASTERISK_GID=1000
    command: ["asterisk", "-f", "-c"]

  # coturn:
