global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'mediasoup-signal'
    static_configs:
      - targets: ['mediasoup-signal:3002']
    metrics_path: '/mediasoup/metrics'

  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: '/minio/prometheus/metrics'

  - job_name: 'coturn'
    static_configs:
      - targets: ['coturn:3478']
    # coturn doesn't expose metrics by default, but can be configured