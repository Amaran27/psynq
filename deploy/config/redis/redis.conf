# Redis Cluster Node Configuration
# Phase 1 Infrastructure - High Availability Redis
# Psitrix Psynq CPaaS Platform

# ----------------------------
# NETWORK
# ----------------------------
bind 0.0.0.0
protected-mode yes
port 6379

# ----------------------------
# CLUSTER CONFIGURATION
# ----------------------------
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
cluster-require-full-coverage no

# Cluster replica validity factor
# A replica will not try to failover if the master link was down for more than:
# (node-timeout * cluster-replica-validity-factor) + repl-ping-replica-period
cluster-replica-validity-factor 10

# Migration barrier: minimum number of replicas a master will remain connected with
cluster-migration-barrier 1

# Allow reads from replicas even during cluster failures
cluster-allow-reads-when-down no

# ----------------------------
# GENERAL
# ----------------------------
daemonize no
supervised no
pidfile /var/run/redis.pid
loglevel notice
logfile ""

# ----------------------------
# SNAPSHOTTING (RDB Persistence)
# ----------------------------
# Save DB to disk if:
#   - After 900 sec (15 min) if at least 1 key changed
#   - After 300 sec (5 min) if at least 10 keys changed
#   - After 60 sec if at least 10000 keys changed
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ----------------------------
# APPEND ONLY FILE (AOF Persistence)
# ----------------------------
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ----------------------------
# SECURITY
# ----------------------------
# requirepass will be set via command line using Docker secrets
# requirepass <password>

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG ""

# ----------------------------
# LIMITS
# ----------------------------
maxclients 10000
maxmemory 256mb
maxmemory-policy allkeys-lru

# ----------------------------
# LAZY FREEING
# ----------------------------
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# ----------------------------
# REPLICATION
# ----------------------------
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-disable-tcp-nodelay no
replica-priority 100

# ----------------------------
# SLOW LOG
# ----------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128

# ----------------------------
# LATENCY MONITOR
# ----------------------------
latency-monitor-threshold 100

# ----------------------------
# EVENT NOTIFICATION
# ----------------------------
notify-keyspace-events ""

# ----------------------------
# ADVANCED CONFIG
# ----------------------------
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes
