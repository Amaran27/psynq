version: '3.8'

# Psitrix Psynq - Production Docker Compose
# Phase 1: Infrastructure Foundation
# Multi-tier network isolation with external access control

networks:
  frontend:
    driver: bridge
    internal: false  # Allows external traffic (NGINX, web clients)
  backend:
    driver: bridge
    internal: true   # Internal only (backend services)
  db_net:
    driver: bridge
    internal: true   # Internal only (database tier)
  monitoring_net:
    driver: bridge
    internal: true   # Internal only (monitoring stack)

volumes:
  postgres_primary_data:
  postgres_replica_data:
  redis_data_1:
  redis_data_2:
  redis_data_3:
  redis_data_4:
  redis_data_5:
  redis_data_6:
  minio_data:
  prometheus_data:
  grafana_data:
  asterisk_var:
  asterisk_spool:
  asterisk_log:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt

services:
  # PostgreSQL Primary Node
  postgres_primary:
    image: postgres:14-alpine
    container_name: psynq_postgres_primary
    networks:
      - db_net
    environment:
      POSTGRES_DB: psynq
      POSTGRES_USER: psynq_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./db/postgres/primary/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./db/postgres/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./db:/docker-entrypoint-initdb.d:ro
    secrets:
      - postgres_password
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psynq_admin || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # PostgreSQL Replica Node
  postgres_replica:
    image: postgres:14-alpine
    container_name: psynq_postgres_replica
    networks:
      - db_net
    environment:
      POSTGRES_DB: psynq
      POSTGRES_USER: psynq_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_PRIMARY_HOST: postgres_primary
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./db/postgres/replica/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh:ro
    depends_on:
      postgres_primary:
        condition: service_healthy
    secrets:
      - postgres_password
    entrypoint: ["/bin/bash", "/docker-entrypoint-initdb.d/init-replica.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psynq_admin || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # PgPool-II - Connection Pooling & Load Balancing
  pgpool:
    image: pgpool/pgpool:4.5-alpine
    container_name: psynq_pgpool
    networks:
      - backend
      - db_net
    ports:
      - "5433:5433"
      - "9898:9898"
    environment:
      PGPOOL_PARAMS: "config_file=/etc/pgpool-II/pgpool.conf"
      POSTGRES_USER: psynq_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: psynq
      POSTGRES_HOST: postgres_primary
      POSTGRES_PORT: 5432
    volumes:
      - ./db/pgpool/pgpool.conf:/etc/pgpool-II/pgpool.conf:ro
      - ./db/pgpool/pool_hba.conf:/etc/pgpool-II/pool_hba.conf:ro
      - ./db/pgpool/pool_passwd:/etc/pgpool-II/pool_passwd:ro
      - ./db/pgpool/init-pgpool.sh:/docker-entrypoint-initdb.d/init-pgpool.sh:ro
    depends_on:
      postgres_primary:
        condition: service_healthy
      postgres_replica:
        condition: service_healthy
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5433 -U psynq_admin || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Redis Cluster (3 masters + 3 replicas)
  redis_master_1:
    image: redis:7-alpine
    container_name: psynq_redis_master_1
    networks:
      - backend
    command: >
      sh -c "redis-server /etc/redis/redis.conf --requirepass $$(cat /run/secrets/redis_password)"
    volumes:
      - redis_data_1:/data
      - ./config/redis/redis.conf:/etc/redis/redis.conf:ro
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "$$(cat /run/secrets/redis_password)", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis_master_2:
    image: redis:7-alpine
    container_name: psynq_redis_master_2
    networks:
      - backend
    command: >
      sh -c "redis-server /etc/redis/redis.conf --requirepass $$(cat /run/secrets/redis_password)"
    volumes:
      - redis_data_2:/data
      - ./config/redis/redis.conf:/etc/redis/redis.conf:ro
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "$$(cat /run/secrets/redis_password)", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis_master_3:
    image: redis:7-alpine
    container_name: psynq_redis_master_3
    networks:
      - backend
    command: >
      sh -c "redis-server /etc/redis/redis.conf --requirepass $$(cat /run/secrets/redis_password)"
    volumes:
      - redis_data_3:/data
      - ./config/redis/redis.conf:/etc/redis/redis.conf:ro
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "$$(cat /run/secrets/redis_password)", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis_replica_1:
    image: redis:7-alpine
    container_name: psynq_redis_replica_1
    networks:
      - backend
    command: >
      sh -c "redis-server /etc/redis/redis.conf --requirepass $$(cat /run/secrets/redis_password)"
    volumes:
      - redis_data_4:/data
      - ./config/redis/redis.conf:/etc/redis/redis.conf:ro
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "$$(cat /run/secrets/redis_password)", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis_replica_2:
    image: redis:7-alpine
    container_name: psynq_redis_replica_2
    networks:
      - backend
    command: >
      sh -c "redis-server /etc/redis/redis.conf --requirepass $$(cat /run/secrets/redis_password)"
    volumes:
      - redis_data_5:/data
      - ./config/redis/redis.conf:/etc/redis/redis.conf:ro
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "$$(cat /run/secrets/redis_password)", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis_replica_3:
    image: redis:7-alpine
    container_name: psynq_redis_replica_3
    networks:
      - backend
    command: >
      sh -c "redis-server /etc/redis/redis.conf --requirepass $$(cat /run/secrets/redis_password)"
    volumes:
      - redis_data_6:/data
      - ./config/redis/redis.conf:/etc/redis/redis.conf:ro
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "$$(cat /run/secrets/redis_password)", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cluster Initialization
  redis_cluster_init:
    image: redis:7-alpine
    container_name: psynq_redis_cluster_init
    networks:
      - backend
    volumes:
      - ./config/redis/init-cluster.sh:/init-cluster.sh:ro
    secrets:
      - redis_password
    depends_on:
      redis_master_1:
        condition: service_healthy
      redis_master_2:
        condition: service_healthy
      redis_master_3:
        condition: service_healthy
      redis_replica_1:
        condition: service_healthy
      redis_replica_2:
        condition: service_healthy
      redis_replica_3:
        condition: service_healthy
    command: ["/bin/sh", "/init-cluster.sh"]
    restart: "no"

  # MinIO S3-compatible storage
  minio:
    image: quay.io/minio/minio:latest
    container_name: psynq_minio
    networks:
      - backend
      - frontend  # Allows direct S3 API access if needed
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    volumes:
      - minio_data:/data
    secrets:
      - minio_root_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # MinIO Initialization
  minio_init:
    image: minio/mc:latest
    container_name: psynq_minio_init
    networks:
      - backend
    volumes:
      - ./config/minio/init-minio.sh:/init-minio.sh:ro
      - ./config/minio/recordings-policy.json:/policies/recordings-policy.json:ro
      - ./config/minio/attachments-policy.json:/policies/attachments-policy.json:ro
      - ./config/minio/exports-policy.json:/policies/exports-policy.json:ro
      - minio_data:/data
    environment:
      MINIO_HOST: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_password
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    restart: "no"

  # Asterisk (Telephony Engine)
  asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile
    container_name: psynq_asterisk
    networks:
      - backend
      - db_net
    environment:
      DB_HOST: postgres_primary
      DB_PORT: 5432
      DB_USER: psynq_admin
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      DB_DATABASE: psynq
    volumes:
      - ./asterisk/asterisk-config:/etc/asterisk:rw
      - asterisk_var:/var/lib/asterisk
      - asterisk_spool:/var/spool/asterisk
      - asterisk_log:/var/log/asterisk
    secrets:
      - postgres_password
    depends_on:
      postgres_primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show version' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Backend API Service
  backend:
    build:
      context: ../
      dockerfile: packages/backend/Dockerfile
      target: production
    container_name: psynq_backend
    networks:
      - backend
      - db_net
    environment:
      NODE_ENV: production
      DB_HOST: postgres_primary
      DB_PORT: 5432
      DB_USERNAME: psynq_admin
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      DB_DATABASE: psynq
      REDIS_HOST: redis_master_1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    secrets:
      - postgres_password
    depends_on:
      postgres_primary:
        condition: service_healthy
      redis_master_1:
        condition: service_healthy
      asterisk:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  # NGINX Reverse Proxy (Frontend network)
  nginx:
    image: nginx:alpine
    container_name: psynq_nginx
    networks:
      - frontend
      - backend
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: psynq_prometheus
    networks:
      - monitoring_net
      - backend  # Scrape backend metrics
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Grafana (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: psynq_grafana
    networks:
      - monitoring_net
      - frontend  # Dashboard access
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3030:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
