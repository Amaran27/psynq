services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.41.2-jammy
    container_name: psynq-playwright
    network_mode: host
    working_dir: /work
    volumes:
      - ../../:/work:rw
      - pw_node_modules:/work/deploy/playwright/node_modules
    environment:
      # Tests read deploy/playwright/.env too; this is just a safe default.
      - APP_URL=${APP_URL:-http://localhost:3000}
      - USERNAME=${USERNAME:-qaadmin}
      - PASSWORD=${PASSWORD:-QaAdmin2026!!}
    command: ["bash", "-lc", "node -v; cd deploy/playwright; npm install --no-fund --no-audit; npx playwright test -c playwright.config.ts console_gate.spec.ts"]

volumes:
  pw_node_modules:
