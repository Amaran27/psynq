# PostgreSQL Client Authentication Configuration (pg_hba.conf)
# Phase 1 Infrastructure - Primary Node
# Psitrix Psynq CPaaS Platform

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local Unix socket connections (for maintenance)
local   all             all                                     trust

# IPv4 local connections
host    all             all             127.0.0.1/32            scram-sha-256

# Allow connections from backend services on Docker network
# Backend network: 172.20.0.0/16 (configured in docker-compose.yml)
host    psynq           psynq_admin     172.20.0.0/16           scram-sha-256
host    psynq           psynq_app       172.20.0.0/16           scram-sha-256

# Allow connections from monitoring tools
host    all             psynq_admin     172.23.0.0/16           scram-sha-256

# Replication connections from standby servers
# Database network: 172.21.0.0/16
host    replication     replicator      172.21.0.0/16           scram-sha-256
host    replication     psynq_admin     172.21.0.0/16           scram-sha-256

# Deny all other connections
host    all             all             0.0.0.0/0               reject
