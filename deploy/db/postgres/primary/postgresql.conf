# PostgreSQL Primary Node Configuration
# Phase 1 Infrastructure - High Availability Setup
# Optimized for Psitrix Psynq CPaaS Platform

# ----------------------------
# CONNECTION SETTINGS
# ----------------------------
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# ----------------------------
# WRITE-AHEAD LOG (WAL)
# Critical for Replication
# ----------------------------
wal_level = replica                  # Enable streaming replication
wal_log_hints = on                   # Required for pg_rewind
max_wal_senders = 10                 # Support up to 10 standby servers
max_replication_slots = 10           # Persistent replication slots
wal_keep_size = 1GB                  # Retain 1GB of WAL for standbys
wal_sender_timeout = 60s             # Timeout for inactive replication connections

# WAL Archiving (for PITR backup)
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f'
archive_timeout = 300                # Force WAL file switch every 5 minutes

# ----------------------------
# REPLICATION
# ----------------------------
hot_standby = on                     # Allow read queries on standby
hot_standby_feedback = on            # Prevent query conflicts on standby
wal_receiver_status_interval = 10s   # Standby sends status updates
max_standby_streaming_delay = 30s    # Max delay before canceling conflicting queries
wal_retrieve_retry_interval = 5s     # Retry interval for standby to fetch WAL

# Synchronous Replication (Optional - Disabled by default)
# synchronous_commit = on
# synchronous_standby_names = 'psynq_postgres_replica'

# ----------------------------
# QUERY TUNING
# ----------------------------
shared_buffers = 256MB               # 25% of available RAM (1GB total assumed)
effective_cache_size = 768MB         # 75% of available RAM
maintenance_work_mem = 64MB          # Memory for maintenance operations
work_mem = 16MB                      # Per-operation sort/hash memory
random_page_cost = 1.1               # SSD optimization (default 4.0 for HDD)

# ----------------------------
# QUERY PLANNING
# ----------------------------
effective_io_concurrency = 200       # SSD concurrency
default_statistics_target = 100      # Statistics detail level

# ----------------------------
# LOGGING
# ----------------------------
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000    # Log queries > 1 second
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_connections = on
log_disconnections = on
log_lock_waits = on                  # Log deadlocks
log_statement = 'ddl'                # Log DDL statements
log_replication_commands = on        # Log replication commands

# ----------------------------
# AUTOVACUUM
# ----------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min            # Check for vacuum every minute
autovacuum_vacuum_scale_factor = 0.1 # Vacuum when 10% rows changed
autovacuum_analyze_scale_factor = 0.05

# ----------------------------
# LOCK MANAGEMENT
# ----------------------------
deadlock_timeout = 1s
max_locks_per_transaction = 64

# ----------------------------
# CHECKPOINTS
# ----------------------------
checkpoint_timeout = 15min           # Force checkpoint every 15 minutes
checkpoint_completion_target = 0.9   # Spread checkpoint I/O
max_wal_size = 2GB                   # Max WAL before checkpoint
min_wal_size = 512MB                 # Min WAL to keep

# ----------------------------
# MONITORING & STATISTICS
# ----------------------------
shared_preload_libraries = 'pg_stat_statements'
track_activities = on
track_counts = on
track_io_timing = on                 # Track I/O timing (slight overhead)
track_functions = all
pg_stat_statements.track = all

# ----------------------------
# CLIENT CONNECTION DEFAULTS
# ----------------------------
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
