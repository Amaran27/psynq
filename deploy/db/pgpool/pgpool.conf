# PgPool-II Configuration
# Phase 1 Infrastructure - Connection Pooling & Load Balancing
# Psitrix Psynq CPaaS Platform

# ----------------------------
# CONNECTION SETTINGS
# ----------------------------
listen_addresses = '*'
port = 5433
socket_dir = '/var/run/postgresql'
pcp_listen_addresses = '*'
pcp_port = 9898
pcp_socket_dir = '/var/run/postgresql'

# ----------------------------
# BACKEND DATABASE NODES
# ----------------------------
# High Availability Configuration with Primary + Replica

backend_hostname0 = 'postgres_primary'
backend_port0 = 5432
backend_weight0 = 1
backend_data_directory0 = '/var/lib/postgresql/data'
backend_flag0 = 'ALWAYS_PRIMARY|DISALLOW_TO_FAILOVER'

backend_hostname1 = 'postgres_replica'
backend_port1 = 5432
backend_weight1 = 1
backend_data_directory1 = '/var/lib/postgresql/data'
backend_flag1 = 'DISALLOW_TO_FAILOVER'

# ----------------------------
# AUTHENTICATION
# ----------------------------
enable_pool_hba = on
pool_passwd = 'pool_passwd'
authentication_type = 'scram-sha-256'
allow_clear_text_frontend_auth = off

# ----------------------------
# CONNECTION POOLING
# ----------------------------
num_init_children = 32
max_pool = 4
child_life_time = 300
child_max_connections = 0
connection_life_time = 300
client_idle_limit = 0

# ----------------------------
# LOAD BALANCING
# ----------------------------
load_balance_mode = on
replication_mode = 'streaming'
replicate_select = on
white_function_list = ''
black_function_list = 'current_user,current_schema,currval,lastval,set_config'

# ----------------------------
# HEALTH CHECK
# ----------------------------
health_check_period = 10
health_check_timeout = 20
health_check_user = 'psynq_admin'
health_check_password = ''
health_check_database = 'psynq'
health_check_max_retries = 3
health_check_retry_delay = 3

# ----------------------------
# FAILOVER
# ----------------------------
failover_on_backend_error = on
detach_offlined_backend = on
search_primary_node_timeout = 300

# ----------------------------
# WATCHDOG (High Availability for PgPool-II itself)
# ----------------------------
use_watchdog = on
wd_hostname = 'pgpool'
wd_port = 9000
wd_priority = 1
wd_authkey = ''
wd_heartbeat_port = 9694
wd_heartbeat_device = ''

# Other PgPool-II nodes (for future multi-instance HA)
# wd_hostname0 = 'pgpool_replica'
# wd_priority0 = 1

# Delegate IP (VIP) configuration
# delegate_IP = ''

# ----------------------------
# MEMORY CACHE
# ----------------------------
memory_cache_enabled = on
memqcache_method = 'shmem'
memqcache_max_num_cache = 1_000_000
memqcache_max_cache_size = 512MB
memqcache_ttl = 300
memqcache_auto_cache_invalidation = on

# ----------------------------
# QUERY CACHE
# ----------------------------
query_cache_mode = 'on'

# ----------------------------
# LOGGING
# ----------------------------
log_destination = 'stderr'
log_line_prefix = '%t: pid %p: '
log_connections = on
log_disconnections = on
log_statement = 'ddl'
log_per_node_statement = on
log_client_messages = off
log_hostname = on
log_min_messages = 'warning'

# ----------------------------
# PERFORMANCE TUNING
# ----------------------------
relcache_expire = 0
relcache_size = 256
check_temp_table = on
check_unlinked_table = on

# ----------------------------
# SSL/TLS (Future Enhancement)
# ----------------------------
ssl = off
