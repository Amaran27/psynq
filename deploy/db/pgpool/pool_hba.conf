# PgPool-II Host Based Authentication Configuration
# Phase 1 Infrastructure - Connection Pooling & Load Balancing
# Psitrix Psynq CPaaS Platform

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local Unix socket connections (for PgPool-II maintenance)
local   all             all                                     trust

# Allow connections from backend services
# Backend network: 172.20.0.0/16 (configured in docker-compose.yml)
host    all             all             172.20.0.0/16           scram-sha-256

# Allow connections from frontend (via API gateway)
host    all             all             172.19.0.0/16           scram-sha-256

# Allow connections from monitoring tools
host    all             all             172.23.0.0/16           scram-sha-256

# Deny all other connections
host    all             all             0.0.0.0/0               reject
