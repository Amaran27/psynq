; Dialplan for Psynq Contact Center
; This handles call routing, IVR, and queuing

[globals]
; Global variables for easy configuration
; Select your trunk: test, twilio, zadarma, or localphone
DEFAULT_TRUNK=twilio
TEST_TRUNK=PJSIP/test-trunk
TWILIO_TRUNK=PJSIP/twilio-trunk
ZADARMA_TRUNK=PJSIP/zadarma-trunk
LOCALPHONE_TRUNK=PJSIP/localphone-trunk
MOH_CLASS=default
RECORDING_FORMAT=wav
RECORDING_LOCATION=/var/spool/asterisk/monitor
; Verified Caller ID for Twilio trial account
TWILIO_CALLER_ID=+12706481767
; ARI application name
ARI_APP=psynq-app

[from-zadarma]
; Handle incoming calls from Zadarma
exten => _X.,1,NoOp(Incoming call from Zadarma to ${EXTEN} from ${CALLERID(num)})
 same => n,Set(__REC_STATUS=RECORDING)
 same => n,Set(__CALL_ID=${CALLERID(name)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Goto(main-ivr,s,1)

[from-localphone]
; Handle incoming calls from Localphone
exten => _X.,1,NoOp(Incoming call from Localphone to ${EXTEN} from ${CALLERID(num)})
 same => n,Set(__REC_STATUS=RECORDING)
 same => n,Set(__CALL_ID=${CALLERID(name)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Goto(main-ivr,s,1)

[from-twilio]
; Handle incoming calls from Twilio (legacy - kept for reference)
exten => _X.,1,NoOp(Incoming call from Twilio to ${EXTEN} from ${CALLERID(num)})
 same => n,Set(__REC_STATUS=RECORDING)
 same => n,Set(__CALL_ID=${CALLERID(name)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Goto(main-ivr,s,1)

[from-webrtc]
; Handle calls from WebRTC clients (agents)
exten => _X.,1,NoOp(Outbound call from WebRTC to ${EXTEN})
 same => n,Set(CALLERID(all)=${CALLERID(name)} <+${CALLERID(num)}>)

; Check if it's an internal extension (1000-1999)
exten => _X.,2,NoOp(Checking if ${EXTEN} is internal extension)
 same => n,GotoIf($[${EXTEN} >= 1000 & ${EXTEN} <= 1999]?internal-call)
 same => n,Goto(outbound-routing,${EXTEN},1)

exten => internal-call,1,NoOp(Internal call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

[agent-origination]
; Handle ARI-originated calls to agents (works around ASTERISK-30042)
; This context is used by Local channels from the backend ARI originate
; The Local channel enters this context and then dials the agent's PJSIP endpoint
; Use 's' extension since Local channels don't pass the extension by default
exten => s,1,NoOp(ARI-originated call to agent ${AGENT_USERNAME})
 same => n,NoOp(AGENT_USERNAME variable is: ${AGENT_USERNAME})
 same => n,Set(AGENT_EXTEN=${AGENT_USERNAME})
 same => n,NoOp(Dialing agent endpoint PJSIP/${AGENT_EXTEN})
 same => n,Dial(PJSIP/${AGENT_EXTEN},30)
 same => n,Hangup()

[from-internal]
; Handle internal calls between agents
exten => _X.,1,NoOp(Internal call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Test extension for echo
exten => 9999,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; Test extension for music on hold
exten => 8888,1,NoOp(Music on hold test)
 same => n,Answer()
 same => n,MusicOnHold(default,60)
 same => n,Hangup()

[main-ivr]
; Main IVR menu
exten => s,1,NoOp(Entering Main IVR)
 same => n,Background(welcome)
 same => n,Background(to-speak-with-sales-press-1)
 same => n,Background(to-speak-with-support-press-2)
 same => n,WaitExten(5)

exten => 1,1,NoOp(Sales department selected)
 same => n,Goto(sales-queue,s,1)

exten => 2,1,NoOp(Support department selected)
 same => n,Goto(support-queue,s,1)

exten => t,1,NoOp(Timeout in IVR)
 same => n,Playback(goodbye)
 same => n,Hangup()

exten => i,1,NoOp(Invalid selection in IVR)
 same => n,Playback(invalid)
 same => n,Goto(s,1)

[sales-queue]
; Sales call queue
exten => s,1,NoOp(Entering sales queue)
 same => n,Answer()
 same => n,Set(__QUEUE_NAME=sales)
 same => n,Set(__QUEUE_TIMEOUT=300)
 same => n,Queue(sales,t,,${QUEUE_TIMEOUT})
 same => n,Playback(nobody-available)
 same => n,Voicemail(100@sales,u)
 same => n,Hangup()

[support-queue]
; Support call queue
exten => s,1,NoOp(Entering support queue)
 same => n,Answer()
 same => n,Set(__QUEUE_NAME=support)
 same => n,Set(__QUEUE_TIMEOUT=180)
 same => n,Queue(support,t,,${QUEUE_TIMEOUT})
 same => n,Playback(nobody-available)
 same => n,Voicemail(200@support,u)
 same => n,Hangup()

[outbound-routing]
; Route outbound calls based on prefix and provider selection
; Uses DEFAULT_TRUNK from globals (change to twilio, zadarma, or localphone)

exten => _+1X.,1,NoOp(North America outbound call to ${EXTEN})
 same => n,Set(PROVIDER=${DEFAULT_TRUNK})
 same => n,Goto(place-call,${EXTEN},1)

exten => _+44X.,1,NoOp(UK outbound call to ${EXTEN})
 same => n,Set(PROVIDER=${DEFAULT_TRUNK})
 same => n,Goto(place-call,${EXTEN},1)

exten => _+X.,1,NoOp(International outbound call to ${EXTEN})
 same => n,Set(PROVIDER=${DEFAULT_TRUNK})
 same => n,Goto(place-call,${EXTEN},1)

; Special extension for testing with 11-digit numbers (assumes +1 country code)
exten => _NXXNXXXXXX,1,NoOp(11-digit North America call to ${EXTEN})
 same => n,Set(PROVIDER=${DEFAULT_TRUNK})
 same => n,Goto(place-call,+1${EXTEN},1)

; Direct extension dialing (for internal testing without trunk)
exten => _1XXX,1,NoOp(Internal extension dial to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

[place-call]
; Actually place the call through selected provider
; Save the destination number before Goto
exten => s,1,NoOp(Placing call through ${PROVIDER} to ${EXTEN})
 same => n,Set(DEST_NUMBER=${EXTEN})
 same => n,Set(CDR(accountcode)=${PROVIDER})
 same => n,Goto(place-call-by-provider,${PROVIDER},1)

; Also support direct pattern matches for testing
exten => _+X.,1,NoOp(Placing call through ${PROVIDER} to ${EXTEN})
 same => n,Set(DEST_NUMBER=${EXTEN})
 same => n,Set(CDR(accountcode)=${PROVIDER})
 same => n,Goto(place-call-by-provider,${PROVIDER},1)

[place-call-by-provider]
; Actually place the call through selected provider
; For Twilio, we need to use the full SIP URI format
exten => test,1,NoOp(Using test trunk)
 same => n,NoOp(Destination number is ${DEST_NUMBER})
 same => n,Dial(PJSIP/test-trunk/sip:${DEST_NUMBER}@tkf27c75cb6eb2a1df1ff35797ecf2edd4.pstn.twilio.com,60)
 same => n,Goto(call-result,${DIALSTATUS},1)

exten => twilio,1,NoOp(Using Twilio trunk)
 same => n,NoOp(Destination number is ${DEST_NUMBER})
 same => n,Set(CALLERID(all)=${TWILIO_CALLER_ID})
 same => n,NoOp(Caller ID set to ${CALLERID(all)})
 same => n,Dial(PJSIP/twilio-trunk/sip:${DEST_NUMBER}@tkf27c75cb6eb2a1df1ff35797ecf2edd4.pstn.twilio.com,60)
 same => n,Goto(call-result,${DIALSTATUS},1)

exten => zadarma,1,NoOp(Using Zadarma trunk)
 same => n,NoOp(Destination number is ${DEST_NUMBER})
 same => n,Dial(PJSIP/zadarma-trunk/${DEST_NUMBER},60)
 same => n,Goto(call-result,${DIALSTATUS},1)

exten => localphone,1,NoOp(Using Localphone trunk)
 same => n,NoOp(Destination number is ${DEST_NUMBER})
 same => n,Dial(PJSIP/localphone-trunk/${DEST_NUMBER},60)
 same => n,Goto(call-result,${DIALSTATUS},1)

[call-result]
; Handle the result of the call attempt
exten => ANSWER,1,NoOp(Call was answered)
 same => n,Hangup()

exten => NOANSWER,1,NoOp(Call was not answered)
 same => n,Playback(cannot-complete-network)
 same => n,Hangup()

exten => BUSY,1,NoOp(Call was busy)
 same => n,Playback(busy)
 same => n,Hangup()

exten => CONGESTION,1,NoOp(Call failed due to congestion)
 same => n,Playback(cannot-complete-network)
 same => n,Hangup()

exten => CHANUNAVAIL,1,NoOp(Channel unavailable)
 same => n,Playback(cannot-complete-network)
 same => n,Hangup()

[macro-recording]
; Macro for call recording
exten => s,1,NoOp(Starting call recording)
 same => n,Set(__MONITOR_EXEC=/usr/local/bin/upload-recording.sh)
 same => n,Set(__MONITOR_EXEC_ARGS=${CALL_ID} ${RECORDING_LOCATION} ${UNIQUEID})
 same => n,Monitor(${RECORDING_FORMAT},${CALL_ID}-${UNIQUEID},mb)
 same => n,Return()

[sub-record-check]
; Subroutine to check if recording should be enabled
exten => s,1,NoOp(Checking recording settings)
 same => n,GotoIf($["${REC_STATUS}"="RECORDING"]?record)
 same => n,GotoIf($["${REC_POLICY}"="always"]?record)
 same => n,Return()

exten => record,1,NoOp(Enabling recording)
 same => n,Set(__REC_STATUS=RECORDING)
 same => n,Return()