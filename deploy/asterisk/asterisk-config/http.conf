; HTTP Configuration for Asterisk REST Interface (ARI)
; This enables the ARI that our backend uses to control Asterisk

[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088
tlsenable=yes
tlsbindaddr=0.0.0.0:8088
;tlscertfile=/etc/asterisk/keys/asterisk.crt
;tlsprivatekey=/etc/asterisk/keys/asterisk.key
; NOTE: Certificate files will be generated during deployment
enablestatic=yes
; No prefix for ARI
allowed_origins=http://localhost:3000,http://127.0.0.1:3000