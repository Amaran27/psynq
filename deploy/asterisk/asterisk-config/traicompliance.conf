; TRAI (Telecom Regulatory Authority of India) Compliance Configuration
; File: traicompliance.conf
; Description: Indian call center regulatory compliance features
;
; Key TRAI Regulations:
; 1. TRAI Telecom Commercial Communication Customer Preference Regulations (TCCCPR) 2018
; 2. Do Not Disturb (DND) Registry Compliance
; 3. Call Recording Consent Announcements
; 4. Data Retention Policies (1 year for recordings, 2 years for CDRs)
; 5. Time Restrictions (9 AM to 8 PM for promotional calls)
; 6. Transactional vs Promotional Call Segregation

[traicompliance-settings]
; Compliance settings (can be overridden per campaign)

; Time restrictions for promotional calls
PROMO_START_TIME=0900 ; 9:00 AM
PROMO_END_TIME=2000   ; 8:00 PM (20:00)

; Recording retention period (in days)
RECORDING_RETENTION_DAYS=365 ; 1 year as per TRAI

; CDR retention period (in days)
CDR_RETENTION_DAYS=730 ; 2 years as per TRAI

; Consent announcement file paths
ANNOUNCEMENT_CONSENT_OUTBOUND=/var/lib/asterisk/sounds/en/consent-outbound.gsm
ANNOUNCEMENT_CONSENT_INBOUND=/var/lib/asterisk/sounds/en/consent-inbound.gsm
ANNOUNCEMENT_DND_CHECK=/var/lib/asterisk/sounds/en/dnd-check.gsm

; DND registry API endpoint (for real-time checking)
; This would connect to TRAI's NDNC (National Do Not Call) registry
DND_REGISTRY_API=http://localhost:8080/api/dnd/check

[consent-announcement-outbound]
; Play consent announcement before recording outbound calls
exten => s,1,NoOp(Playing TRAI consent announcement for outbound call)
 same => n,Answer()
 same => n,Wait(1)
; Play: "This call is being recorded for quality and training purposes"
 same => n,Playback(consent-outbound)
 same => n,Wait(0.5)
 same => n,Return()

[consent-announcement-inbound]
; Play consent announcement for inbound calls
exten => s,1,NoOp(Playing TRAI consent announcement for inbound call)
 same => n,Answer()
 same => n,Wait(1)
; Play: "This call is being recorded for quality and training purposes"
 same => n,Playback(consent-inbound)
 same => n,Wait(0.5)
 same => n,Return()

[check-dnd-registry]
; Check if number is in TRAI DND registry
; This context is called before placing outbound calls
exten => s,1,NoOp(Checking TRAI DND registry for ${DST_NUMBER})
 ; In production, this would query the NDNC registry API
 ; For now, we'll use a local database table
 same => n,Set(DND_STATUS=NOT_FOUND)
 ; Query DND database (would be implemented via func_odbc)
 ; same => n,Set(DND_STATUS=${ODBC_DND_CHECK(${DST_NUMBER})})
 ; If number is in DND, abort the call
 same => n,GotoIf($[${DND_STATUS} = "FOUND"]?dnd-found)
 same => n,Return()

exten => dnd-found,1,NoOp(Number is in TRAI DND registry, aborting call)
 same => n,Playback(sorry-youre-having-trouble)
 same => n,Playback(vm-goodbye)
 same => n,Hangup(21) ; Special hangup code for DND

[check-time-restrictions]
; Check if current time is within allowed hours for promotional calls
exten => s,1,NoOp(Checking time restrictions for promotional call)
 same => n,Set(CURRENT_HOUR=${STRFTIME(,,%H)})
 same => n,Set(CURRENT_MINUTE=${STRFTIME(,,%M)})
 same => n,NoOp(Current time is ${CURRENT_HOUR}:${CURRENT_MINUTE})
 ; Check if before 9 AM
 same => n,GotoIf($[${CURRENT_HOUR} < 9]?outside-hours)
 ; Check if after 8 PM (20:00)
 same => n,GotoIf($[${CURRENT_HOUR} > 20]?outside-hours)
 ; Check if exactly 8 PM but minute is not 00
 same => n,GotoIf($[${CURRENT_HOUR} = 20 & ${CURRENT_MINUTE} > 0]?outside-hours)
 same => n,Return() ; Within allowed hours

exten => outside-hours,1,NoOp(Current time is outside TRAI promotional hours (9 AM to 8 PM))
 same => n,Playback(sorry-youre-having-trouble)
 same => n,Playback(vm-goodbye)
 same => n,Hangup(22) ; Special hangup code for time restriction

[cdr-compliance-fields]
; Add TRAI-required CDR fields
; These are set before the call ends
exten => s,1,NoOp(Setting TRAI compliance CDR fields)
 ; Mark call type (transactional/promotional)
 same => n,Set(CDR(userfield)=${CALL_TYPE})
 ; Set campaign ID for reporting
 same => n,Set(CDR(accountcode)=${CAMPAIGN_ID})
 ; Mark if consent was obtained
 same => n,Set(__CONSENT_OBTAINED=TRUE)
 same => n,Return()

[recording-retention-policy]
; This macro is called periodically to clean up old recordings
; Should be run via cron (e.g., weekly)
exten => s,1,NoOp(TRAI Recording Retention Policy - Checking for old recordings)
 ; Calculate cutoff date (1 year ago for recordings)
 same => n,Set(CUTOFF_DATE=${STRFTIME(,,%Y%m%d,%Y-%m-%d)})
 ; In production, this would run a script to:
 ; 1. Move recordings older than 1 year to archival storage
 ; 2. Delete recordings older than 1 year from MinIO
 ; 3. Keep CDR records for 2 years
 ; For now, just log
 same => n,NoOp(Would delete recordings older than ${CUTOFF_DATE})
 same => n,Hangup()
