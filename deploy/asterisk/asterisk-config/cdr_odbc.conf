; Asterisk Call Detail Record (CDR) configuration for ODBC
; Logs all call details to PostgreSQL database via ODBC connection

[global]
dsn = psynq
; Use the same DSN name as defined in odbc.ini and res_odbc.conf

; Log unique call IDs for tracking
loguniqueid = yes

; Include disposition string (answered, busy, no answer, etc.)
dispositionstring = yes

; Use GMT/UTC time for consistent timestamps
usegmtime = yes

; Enable new CDR record format
newcdrrecord = yes

; Log CDRs even if call fails
logunanswered = yes

; Log CDRs for busy calls
logbusy = yes

; Log CDRs for unanswered calls
lognoanswer = yes
