; SIP Configuration (Legacy)
; This is kept for compatibility with any legacy devices

[general]
context=default
allowoverlap=no
udpbindaddr=0.0.0.0:5060
tcpenable=no
tcpbindaddr=0.0.0.0:5060
transport=udp
srvlookup=yes

; Authentication for Twilio
register => your_twilio_username:your_twilio_password@your-domain.pstn.twilio.com

[twilio-out]
type=peer
host=your-domain.pstn.twilio.com
secret=your_twilio_password
username=your_twilio_username
context=from-twilio
insecure=port,invite
qualify=yes
directmedia=no
disallow=all
allow=ulaw
allow=alaw