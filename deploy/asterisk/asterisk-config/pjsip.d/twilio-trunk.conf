; Twilio SIP Trunk Configuration for Free Trial Account
; This configuration enables outbound calls to mobile numbers using Twilio's free SIP trunk

; ============================================================
; STEP 1: Get these values from Twilio Console
; ============================================================
; 1. Go to https://console.twilio.com/us1/develop/sip/trunking
; 2. Click on your existing SIP Trunk (or create one - free on trial)
; 3. Go to "Credentials" tab
; 4. Create a "Credential List" with username/password
; 5. Create an "IP Access Control List" with YOUR PUBLIC IP
;    - Find your public IP: curl ifconfig.me
; 6. Link both to your SIP Trunk
; 7. Copy the SIP URI from Trunk settings (Format: sip:[trunk-name].pstn.twilio.com)

; ============================================================
; STEP 2: Verify Your Phone Number in Twilio
; ============================================================
; 1. Go to https://console.twilio.com/us1/develop/phone-numbers/manage/verified
; 2. Click "+" to verify your mobile number
; 3. Twilio will call you with a verification code
; 4. Enter the code to verify
; ⚠️ ON FREE TRIAL: You can ONLY call verified numbers!

; ============================================================
; STEP 3: Update Configuration Below
; ============================================================

; Twilio Elastic SIP Trunk Configuration
; Trunk SID: TKf27c75cb6eb2a1df1ff35797ecf2edd4
; SIP Domain: tkf27c75cb6eb2a1df1ff35797ecf2edd4.pstn.twilio.com
; Credentials: psynq_sip_trunk_username / psynq_sip_trunk_Pass29

[twilio-trunk]
type=endpoint
transport=transport-udp
context=from-twilio
disallow=all
allow=ulaw,alaw
; Twilio requires G.711 (ulaw/alaw) codec
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
from_domain=tkf27c75cb6eb2a1df1ff35797ecf2edd4.pstn.twilio.com
trust_id_inbound=no
send_rpid=yes
t38_udptl=no
aors=twilio-aor

[twilio-auth]
type=auth
auth_type=userpass
username=psynq_sip_trunk_username
password=psynq_sip_trunk_Pass29

[twilio-aor]
type=aor
contact=sip:tkf27c75cb6eb2a1df1ff35797ecf2edd4.pstn.twilio.com
qualify_frequency=60
qualify_timeout=5

[twilio-identify]
type=identify
endpoint=twilio-trunk
match=tkf27c75cb6eb2a1df1ff35797ecf2edd4.pstn.twilio.com

[twilio-registration]
type=registration
transport=transport-udp
outbound_auth=twilio-auth
server_uri=sip:tkf27c75cb6eb2a1df1ff35797ecf2edd4.pstn.twilio.com
client_uri=sip:psynq_sip_trunk_username@tkf27c75cb6eb2a1df1ff35797ecf2edd4.pstn.twilio.com
retry_interval=60
forbidden_retry_interval=300
auth_rejection_permanent=false
line=yes
endpoint=twilio-trunk

; ============================================================
; IMPORTANT NOTES FOR FREE TRIAL:
; ============================================================
; 1. You MUST verify your mobile number in Twilio Console first
; 2. Calls will play "Trial account" message before connecting
; 3. Max 10 minutes per call
; 4. Max 4 concurrent calls
; 5. Can ONLY call verified numbers
; ============================================================

; HOW TO TEST:
; 1. After updating this file, restart Asterisk:
;    docker-compose restart asterisk
;
; 2. Check if registration succeeds:
;    docker exec -it psynq-asterisk asterisk -rx "pjsip show registrations"
;
; 3. Test outbound call (replace with YOUR verified mobile):
;    docker exec -it psynq-asterisk asterisk -rx "channel originate PJSIP/+1234567890@twilio-trunk application echo"
;
; 4. Monitor SIP traffic:
;    docker exec -it psynq-asterisk asterisk -rx "pjsip set logger on"
;
; ============================================================
; TROUBLESHOOTING:
; ============================================================
; If registration fails:
; - Check your public IP is added to Twilio IP ACL
; - Verify username/password from Credential List
; - Check Asterisk logs: docker logs psynq-asterisk
;
; If calls fail:
; - Verify destination number is verified in Twilio Console
; - Check your Caller ID is set to Twilio number or verified number
; - Ensure Geographic Permissions allow calls to your country
; ============================================================
