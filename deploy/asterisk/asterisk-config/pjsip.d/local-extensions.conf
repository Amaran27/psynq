; Local SIP Extensions for Testing
; This creates internal SIP users that can call each other
; No external trunk required - completely free!

; Agent 1: Alice
[alice](webrtc_client)
type=endpoint
aors=alice
callerid="Alice Agent" <1001>
mailboxes=alice@default

[alice]
type=aor
qualify_frequency=60

[alice](auth-userpass)
type=auth
username=alice
password=alice123
; Simple password for testing

; Agent 2: Bob  
[bob](webrtc_client)
type=endpoint
aors=bob
callerid="Bob Agent" <1002>

[bob]
type=aor
qualify_frequency=60

[bob](auth-userpass)
type=auth
username=bob
password=bob123

; Agent 3: Charlie
[charlie](webrtc_client)
type=endpoint
aors=charlie
callerid="Charlie Supervisor" <1003>

[charlie]
type=aor
qualify_frequency=60

[charlie](auth-userpass)
type=auth
username=charlie
password=charlie123
