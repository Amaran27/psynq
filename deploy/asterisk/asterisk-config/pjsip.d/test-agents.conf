; Test Agent Extensions for Local Testing
; These are simple SIP extensions for testing without any external trunk

[agent-1000](!)
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw,opus
transport=transport-udp
auth=auth-1000
aors=1000
mailboxes=1000@default
callerid="Agent 1000" <1000>

[auth-1000]
type=auth
auth_type=userpass
password=secret1000
username=1000

[1000]
type=aor
max_contacts=1
qualify_frequency=60

