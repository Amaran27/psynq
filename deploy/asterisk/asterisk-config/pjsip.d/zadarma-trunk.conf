; Zadarma SIP Trunk Configuration
; FREE for testing: https://zadarma.com/en/
; 
; SIGNUP INSTRUCTIONS:
; 1. Go to https://zadarma.com/en/signup/
; 2. Register for free account (no credit card needed for test tier)
; 3. Get 10-20 free test calls to mobile numbers
; 4. Navigate to Settings -> SIP Settings
; 5. Copy your SIP credentials (SIP Server, Username, Password)
; 6. Update the placeholders below
;
; ALTERNATIVE: Localphone (Pay-as-you-go, ~$0.005/min)
; 1. Go to https://www.localphone.com/
; 2. Deposit $10 (lasts for months of testing)
; 3. Get SIP credentials from Account -> SIP Settings

; ===========================
; TRANSPORT (UDP for trunk)
; ===========================
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ===========================
; ZADARMA SIP TRUNK
; ===========================
; REPLACE THESE WITH YOUR CREDENTIALS:
; - YOUR_ZADARMA_SIP_SERVER (e.g., sip.zadarma.com)
; - YOUR_ZADARMA_SIP_USER (your numeric SIP ID)
; - YOUR_ZADARMA_SIP_PASSWORD

[zadarma-trunk](webrtc_client)
type=endpoint
context=from-zadarma
disallow=all
allow=ulaw
allow=alaw
transport=transport-udp
from_domain=YOUR_ZADARMA_SIP_SERVER
direct_media=no
trust_id_inbound=yes
send_rpid=yes
t38_udptl=no
fax_detect=no
rtptimeout=60
rtpholdtimeout=300

[auth-zadarma]
type=auth
auth_type=userpass
password=YOUR_ZADARMA_SIP_PASSWORD
username=YOUR_ZADARMA_SIP_USER

[identify-zadarma]
type=identify
endpoint=zadarma-trunk
match=YOUR_ZADARMA_SIP_SERVER

[aor-zadarma]
type=aor
contact=sip:YOUR_ZADARMA_SIP_USER@YOUR_ZADARMA_SIP_SERVER
qualify_frequency=60

; ===========================
; REGISTRATION (Optional - for inbound)
; ===========================
; Only enable if you have a DID number from Zadarma
[zadarma-registration]
type=registration
transport=transport-udp
outbound_auth=auth-zadarma
client_uri=sip:YOUR_ZADARMA_SIP_USER@YOUR_ZADARMA_SIP_SERVER
server_uri=sip:YOUR_ZADARMA_SIP_SERVER
retry_interval=60
forbidden_retry_interval=300
line=yes
endpoint=zadarma-trunk

; ===========================
; ALTERNATIVE: LOCALPHONE
; ===========================
; If using Localphone instead:
; - SIP server: sip.localphone.com
; - Use your Localphone SIP username/password

[localphone-trunk](webrtc_client)
type=endpoint
context=from-localphone
disallow=all
allow=ulaw
allow=alaw
transport=transport-udp
from_domain=sip.localphone.com
direct_media=no

[auth-localphone]
type=auth
auth_type=userpass
password=YOUR_LOCALPHONE_PASSWORD
username=YOUR_LOCALPHONE_SIP_ID

[identify-localphone]
type=identify
endpoint=localphone-trunk
match=sip.localphone.com

[aor-localphone]
type=aor
contact=sip:YOUR_LOCALPHONE_SIP_ID@sip.localphone.com
qualify_frequency=60

[localphone-registration]
type=registration
transport=transport-udp
outbound_auth=auth-localphone
client_uri=sip:YOUR_LOCALPHONE_SIP_ID@sip.localphone.com
server_uri=sip:sip.localphone.com
retry_interval=60
line=yes
endpoint=localphone-trunk

; ===========================
; USAGE INSTRUCTIONS
; ===========================
; After updating credentials:
; 1. Restart Asterisk: docker-compose restart asterisk
; 2. Check registration: asterisk -rx "pjsip show registrations"
; 3. Test outbound call:
;    - From Asterisk CLI: channel originate PJSIP/+1234567890@zadarma-trunk application echo
;    - Replace +1234567890 with your mobile number
; 4. For Localphone: Use localphone-trunk instead of zadarma-trunk
