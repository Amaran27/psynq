[modules]
autoload=yes

; Preload essential modules to ensure dependencies are met
preload = res_odbc.so
preload = res_config_odbc.so
preload = res_crypto.so
preload = res_rtp_asterisk.so
preload = res_http.so

; Explicitly load PJSIP core
load = res_pjsip.so
load = res_pjsip_session.so
load = chan_pjsip.so

; Disable old SIP channel
noload = chan_sip.so

; Required for WebRTC/WS
load = res_http.so
load = res_http_websocket.so
load = res_pjsip_transport_websocket.so

; Required for ARI
load = res_ari.so
load = res_ari_applications.so

; Keep it simple, let autoload handle the rest