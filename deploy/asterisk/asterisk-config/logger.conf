; Logging Configuration for Asterisk
; This sets up appropriate logging levels and file rotation

[general]
dateformat=%F %T
appendhostname=yes
queue_log=yes
eventfilter=!AMI,CALL,DTMF

[logfiles]
console => notice,warning,error,debug
messages => notice,warning,error
full => notice,warning,error,debug,verbose,dtmf,fax
; Rotate log files daily
rotatestrategy = rotate