; Global settings for PJSIP
[global]
type=global
user_agent=Psynq-SBC
endpoint_identifier_order=username,ip,anonymous


; PJSIP Configuration for Psynq
; This configures SIP endpoints for connecting to Twilio and other providers

; Include all provider configurations from pjsip.d directory
#include pjsip.d/*.conf

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8088
; WebRTC transport for browser clients

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; NAT configuration for Docker Windows
local_net=172.18.0.0/16
local_net=172.20.0.0/16
local_net=192.168.0.0/16
local_net=127.0.0.0/8
external_media_address=27.5.214.230
external_signaling_address=27.5.214.230
; Standard UDP transport for SIP trunking

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
local_net=172.20.0.0/16
local_net=127.0.0.1/32
external_media_address=27.7.233.180
external_signaling_address=27.7.233.180
; TCP transport for SIP trunking

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
method=tlsv1_2
verify_server=no
verify_client=no
; Certificate files removed to avoid handshake issues if not needed by provider

; WebRTC Client Template
[webrtc_client](!)
type=endpoint
context=from-webrtc
disallow=all
allow=ulaw,opus,vp8
transport=transport-ws
use_avpf=yes
media_address=127.0.0.1
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=yes
stunaddr=stun.l.google.com:19302
media_use_received_transport=yes
dtls_enable=yes
dtls_verify=fingerprint
dtls_cert_file=/var/lib/asterisk/keys/asterisk.crt
dtls_private_key=/var/lib/asterisk/keys/asterisk.key
; NOTE: Certificate files will be generated during deployment
dtls_setup=actpass

; Agent endpoints will be created dynamically in the database
; No static files required in pjsip.d/

; ============================================
; TEST TRUNK (for testing dialplan without real provider)
; ============================================
[test-aor]
type=aor
contact=sip:127.0.0.1:5060

[test-trunk]
type=endpoint
context=from-test
disallow=all
allow=ulaw
transport=transport-udp
aors=test-aor

[test-identify]
type=identify
endpoint=test-trunk
match=127.0.0.1

; ============================================
; TWILIO ELASTIC SIP TRUNK
; ============================================
; Trunk SID: TKf27c75cb6eb2a1df1ff35797ecf2edd4
; SIP Domain: tkf27c75cb6eb2a1df1ff35797ecf2edd4.pstn.twilio.com
; Credentials: psynq_sip_trunk_username / psynq_sip_trunk_Pass29

[twilio-aor]
type=aor
; Use TLS transport to Twilio on 5061 to avoid UDP filtering on some networks
contact=sip:tkf27c75cb6eb2a1df1ff35797ecf2edd4.pstn.twilio.com:5061;transport=tls
qualify_frequency=60
qualify_timeout=5

[twilio-auth]
type=auth
auth_type=userpass
username=psynq_sip_trunk_username
password=psynq_sip_trunk_Pass29
realm=sip.twilio.com

[twilio-trunk]
type=endpoint
; Use TLS transport to Twilio (outbound over TLS on port 5061)
transport=transport-tls
context=from-twilio
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
from_domain=tkf27c75cb6eb2a1df1ff35797ecf2edd4.pstn.twilio.com
from_user=psynq_sip_trunk_username
trust_id_inbound=no
send_rpid=yes
t38_udptl=no
aors=twilio-aor
outbound_auth=twilio-auth

[twilio-identify]
type=identify
endpoint=twilio-trunk
match=tkf27c75cb6eb2a1df1ff35797ecf2edd4.pstn.twilio.com

[twilio-registration]
type=registration
; register to Twilio over TLS so responses are negotiated over TLS/TCP (port 5061)
transport=transport-tls
outbound_auth=twilio-auth
server_uri=sip:tkf27c75cb6eb2a1df1ff35797ecf2edd4.pstn.twilio.com:5061;transport=tls
client_uri=sip:psynq_sip_trunk_username@tkf27c75cb6eb2a1df1ff35797ecf2edd4.pstn.twilio.com
retry_interval=60
forbidden_retry_interval=300
auth_rejection_permanent=false
line=yes
endpoint=twilio-trunk

[sip2sip-reg]
type=registration
transport=transport-tls
outbound_auth=sip2sip-auth
outbound_proxy=sip:proxy.sipthor.net:5061
server_uri=sip:sip2sip.info:5061
client_uri=sip:manimaran@sip2sip.info
contact_user=manimaran
retry_interval=60
auth_rejection_permanent=false

[sip2sip-auth]
type=auth
auth_type=userpass
username=manimaran
password=Amarancse@27

[sip2sip-aor]
type=aor
contact=sip:2way.ipcomms.net:5061;transport=TLS
qualify_frequency=60

[sip2sip-trunk]
type=endpoint
transport=transport-tls
context=from-sip2sip
disallow=all
allow=ulaw,alaw,gsm,opus
outbound_auth=sip2sip-auth
auth=sip2sip-auth
aors=sip2sip-aor
from_user=manimaran
from_domain=sip2sip.info
direct_media=no
rtp_symmetric=yes
force_rport=yes

