; Global settings for PJSIP
[global]
type=global
user_agent=Psynq-SBC
endpoint_identifier_order=username,ip,anonymous
; Allow registrations via localhost/127.0.0.1 for development
domain_alias=localhost
domain_alias=127.0.0.1
; Force trimming of whitespace from database lookups
realtime_trim_whitespace=yes


; PJSIP Configuration for Psynq
; This configures SIP endpoints for connecting to Twilio and other providers

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8088
; WebRTC transport for browser clients

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Standard UDP transport for SIP trunking

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
; TCP transport for SIP trunking

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
; Certificate files will be generated during deployment
cert_file=/var/lib/asterisk/keys/asterisk.crt
priv_key_file=/var/lib/asterisk/keys/asterisk.key
; TLS transport for secure SIP trunking

; WebRTC Client Template
[webrtc_client](!)
type=endpoint
context=from-webrtc
disallow=all
allow=ulaw,opus,vp8
transport=transport-ws
use_avpf=yes
media_address=127.0.0.1
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=yes
stunaddr=stun.l.google.com:19302
media_use_received_transport=yes
dtls_enable=yes
dtls_verify=fingerprint
dtls_cert_file=/var/lib/asterisk/keys/asterisk.crt
dtls_private_key=/var/lib/asterisk/keys/asterisk.key
; NOTE: Certificate files will be generated during deployment
dtls_setup=actpass

; Agent endpoints will be created dynamically in the database
; No static files required in pjsip.d/