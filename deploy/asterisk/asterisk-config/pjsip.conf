; Global settings for PJSIP
[global]
type=global
user_agent=Psynq-SBC
endpoint_identifier_order=username,ip,anonymous


; PJSIP Configuration for Psynq
; This configures SIP endpoints for connecting to Twilio and other providers

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8088
; WebRTC transport for browser clients

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Standard UDP transport for SIP trunking

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
local_net=172.20.0.0/16
local_net=127.0.0.1/32
external_media_address=27.7.233.180
external_signaling_address=27.7.233.180
; TCP transport for SIP trunking

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
method=tlsv1_2
verify_server=no
verify_client=no
; Certificate files removed to avoid handshake issues if not needed by provider

; WebRTC Client Template
[webrtc_client](!)
type=endpoint
context=from-webrtc
disallow=all
allow=ulaw,opus,vp8
transport=transport-ws
use_avpf=yes
media_address=127.0.0.1
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=yes
stunaddr=stun.l.google.com:19302
media_use_received_transport=yes
dtls_enable=yes
dtls_verify=fingerprint
dtls_cert_file=/var/lib/asterisk/keys/asterisk.crt
dtls_private_key=/var/lib/asterisk/keys/asterisk.key
; NOTE: Certificate files will be generated during deployment
dtls_setup=actpass

; Agent endpoints will be created dynamically in the database
; No static files required in pjsip.d/

[sip2sip-reg]
type=registration
transport=transport-tls
outbound_auth=sip2sip-auth
outbound_proxy=sip:proxy.sipthor.net:5061
server_uri=sip:sip2sip.info:5061
client_uri=sip:manimaran@sip2sip.info
contact_user=manimaran
retry_interval=60
auth_rejection_permanent=false

[sip2sip-auth]
type=auth
auth_type=userpass
username=manimaran
password=Amarancse@27

[sip2sip-aor]
type=aor
contact=sip:2way.ipcomms.net:5061;transport=TLS
qualify_frequency=60

[sip2sip-trunk]
type=endpoint
transport=transport-tls
context=from-sip2sip
disallow=all
allow=ulaw,alaw,gsm,opus
outbound_auth=sip2sip-auth
auth=sip2sip-auth
aors=sip2sip-aor
from_user=manimaran
from_domain=sip2sip.info
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes