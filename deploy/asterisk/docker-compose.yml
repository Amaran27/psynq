services:
  asterisk:
    build: 
      context: .
      dockerfile: Dockerfile
    image: psynq-asterisk-realtime
    container_name: psynq-asterisk
    environment:
      - ASTERISK_UID=${ASTERISK_UID}
      - ASTERISK_GID=${ASTERISK_GID}
      - TZ=${TZ}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - ARI_USER=${ARI_USER}
      - ARI_PASSWORD=${ARI_PASSWORD}
    ports:
      # SIP ports
      - '5060:5060/udp'   # SIP UDP
      - '5061:5061/tcp'   # SIP TCP
      - '5062:5062/tcp'   # SIP TLS
      # ARI/HTTP ports
      - '8088:8088/tcp'   # ARI HTTP
      - '8089:8089/tcp'   # WebRTC WSS
      # RTP ports
      - '10000-10100:10000-10100/udp'  # RTP media range
    volumes:
      - ./asterisk-config:/etc/asterisk:rw
      - asterisk-var:/var/lib/asterisk
      - asterisk-spool:/var/spool/asterisk
      - asterisk-log:/var/log/asterisk
    networks:
      - psynq-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show uptime"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  asterisk-var:
    driver: local
  asterisk-spool:
    driver: local
  asterisk-log:
    driver: local

networks:
  psynq-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Notes:
# - This compose file is configured for local development with Docker networking
# - RTP ports (10000-10100) are exposed for media streams
# - Volumes ensure persistent storage for recordings and logs
# - Healthcheck ensures Asterisk is running properly
# - Custom network allows inter-container communication
# - For production, consider:
#   - Not exposing SIP ports publicly
#   - Using Session Border Controller (SBC)
#   - Implementing proper firewall rules
#   - Using certificates from a trusted CA
#   - Configuring proper log rotation