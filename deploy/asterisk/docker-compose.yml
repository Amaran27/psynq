services:
  asterisk:
    build: 
      context: .
      dockerfile: Dockerfile
    image: psynq-asterisk
    container_name: psynq-asterisk
    network_mode: host  # CRITICAL: Host networking required for SIP/UDP to work on Windows Docker
    env_file:
      - ../../packages/backend/.env
    environment:
      - ASTERISK_UID=${ASTERISK_UID}
      - ASTERISK_GID=${ASTERISK_GID}
      - TZ=${TZ}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - ARI_USER=${ARI_USER}
      - ARI_PASSWORD=${ARI_PASSWORD}
    # Ports NOT mapped with host networking - container uses host network directly
    # SIP ports: 5060/udp, 5061/tcp, 5062/tcp
    # ARI ports: 8088/tcp, 8089/tcp
    # RTP ports: 10000-10100/udp
    volumes:
      # Mount custom Asterisk configurations (Twilio SIP trunk, dialplan, etc.)
      - ./asterisk-config:/etc/asterisk:rw
      - asterisk-var:/var/lib/asterisk
      - asterisk-spool:/var/spool/asterisk
      - asterisk-log:/var/log/asterisk
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show version' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  asterisk-var:
    driver: local
  asterisk-spool:
    driver: local
  asterisk-log:
    driver: local

# Note: Custom network removed - using host networking instead

# Notes:
# - CRITICAL: Uses host networking to bypass Docker Desktop Windows UDP/SIP bug
#   Without host networking, Docker Desktop on Windows CANNOT send UDP packets
#   to external servers (known Docker bug with NAT/UDP). Host networking is
#   REQUIRED for SIP trunking to work.
#   Reference: https://stackoverflow.com/questions/54792402/
# - Host networking means container shares host's network stack
# - Ports are NOT mapped - container binds directly to host ports
# - To use: Enable "host networking" in Docker Desktop Settings → Resources → Network
# - RTP ports (10000-10100) work directly on host network
# - Volumes ensure persistent storage for recordings and logs
# - Healthcheck ensures Asterisk is running properly
# - For production, consider:
#   - Not exposing SIP ports publicly (use firewall rules)
#   - Using Session Border Controller (SBC)
#   - Using certificates from a trusted CA
#   - Configuring proper log rotation