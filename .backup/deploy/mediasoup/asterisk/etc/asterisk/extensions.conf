[default]
exten => _X.,1,NoOp(Incoming call from ${CALLERID(num)} to ${EXTEN})
same => n,Stasis(psynq-app)
same => n,Hangup()

[outbound]
exten => _X.,1,NoOp(Outbound call to ${EXTEN})
same => n,Dial(PJSIP/${EXTEN}@twilio-trunk)
same => n,Hangup()

exten => alice,1,NoOp(Call to Alice)
same => n,Stasis(psynq-app)
same => n,Hangup()

exten => bob,1,NoOp(Call to Bob)
same => n,Stasis(psynq-app)
same => n,Hangup()