version: '3.8'
services:
  coturn:
    image: instrumentisto/coturn:4.5.2
    container_name: psynq-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    command: ["turnserver", "-v", "--no-dtls", "--no-tls", "--listening-port", "3478", "--min-port", "49152", "--max-port", "65535", "--lt-cred-mech", "--realm", "psynq.local", "--user", "testuser:testpass"]
    # Note: this is for local dev only. For production, configure long-term shared secret and TLS.

  # janus:
  #   image: meetecho/janus-gateway:latest
  #   container_name: psynq-janus
  #   restart: unless-stopped
  #   ports:
  #     - "8087:8088"   # HTTP admin API and demos
  #     - "7088:7088"   # Admin websockets (if used)
  #     - "10000-10200:10000-10200/udp" # RTP (adjust range as needed)
  #   environment:
  #     - "JANUS_LOG_LEVEL=4"
  #   volumes:
  #     - ./janus-config:/usr/local/etc/janus

# Usage:
#  cd deploy/rtc && docker-compose up -d
# This will start a local coturn and janus instance for development and testing.
# For production: use secure credentials, TLS, and restrict public exposure.